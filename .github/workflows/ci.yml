name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growthlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, statistics, data and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      GROWTHLAB_DEMO_USERS: "5000"
      GROWTHLAB_DEMO_SEED: "42"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and QA dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q analytics backend scripts frontend tests

      - name: Lint
        run: python -m ruff check analytics backend scripts frontend tests

      - name: Verify formatting
        run: python -m ruff format --check analytics backend scripts frontend tests

      - name: Run statistical, data-quality, API and Streamlit tests
        run: >-
          python -m pytest
          --cov=analytics
          --cov=backend
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
          --junitxml=pytest-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore

  web:
    name: React dashboard quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Lint and typecheck
        working-directory: web
        run: npm run lint && npm run typecheck

      - name: Build production dashboard
        working-directory: web
        run: npm run build

  containers:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend and frontend images
        run: docker compose build --pull
