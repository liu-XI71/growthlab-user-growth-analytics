services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GROWTHLAB_DB_PATH: /app/data/demo/growthlab.duckdb
      GROWTHLAB_DEMO_USERS: ${GROWTHLAB_DEMO_USERS:-100000}
      GROWTHLAB_DEMO_SEED: ${GROWTHLAB_DEMO_SEED:-42}
    volumes:
      - growthlab_data:/app/data/demo
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      # The canonical 100k-user dataset is generated on first boot and takes
      # roughly 3-4 minutes on the reference Windows machine.  Do not mark the
      # backend unhealthy while that deterministic bootstrap is still running.
      start_period: 6m
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v2
    ports:
      - "8501:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  growthlab_data:
